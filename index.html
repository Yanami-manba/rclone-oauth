<main><h1>rclone 私人云盘传输</h1>
<p>这是供账号所有者本人使用的本地文件传输配置，使用开源工具 rclone，在本人的 Windows 计算机与获授权的 Google Drive 账号之间上传、下载和核对文件。</p>
<p>本应用没有面向公众的注册或文件上传服务。此网站仅提供应用说明和隐私政策，不接收 Google 授权令牌或云盘文件。</p>
<p>应用支持联系方式以 Google OAuth 同意屏幕列出的支持邮箱为准。</p>
<p><a href="privacy.html">隐私政策</a> · <a href="https://rclone.org/">rclone 官方网站</a></p></main>
